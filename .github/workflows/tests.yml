name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar testes
        env:
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET: "ci-secret-easyfood"
        run: pytest tests/ -v
